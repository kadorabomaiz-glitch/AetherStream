name: "🚀 AETHER Stream Bau-Fabrik"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-fire-tv-apk:
    name: "📺 Fire TV APK bauen"
    runs-on: ubuntu-latest

    steps:
      - name: "Projekt-Dateien laden"
        uses: actions/checkout@v4

      - name: "Java 17 einrichten"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Gradle Wrapper erzeugen"
        run: gradle wrapper --gradle-version 8.9

      - name: "APK kompilieren"
        run: ./gradlew assembleDebug --no-daemon

      - name: "APK als Artefakt speichern"
        uses: actions/upload-artifact@v4
        with:
          name: AetherStream-FireTV-APK
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
